<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CarERP Featured Project</title>
  <desc id="desc">A dark green editorial card describing the CarERP used-car dealership ERP project and its engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244539"/>
      <stop offset="100%" stop-color="#315747"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#779999" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#F4F0DD" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#13271F" flood-opacity=".20"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="1164" height="384" rx="28" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Botanical / data motif -->
  <circle cx="1040" cy="115" r="120" fill="url(#orb)" opacity=".55"/>
  <circle cx="1122" cy="350" r="92" fill="#779999" opacity=".12"/>
  <path d="M980 88 C1018 84 1054 107 1068 142 C1081 174 1068 207 1036 225"
        fill="none" stroke="#F4F0DD" stroke-opacity=".38" stroke-width="2"/>
  <path d="M1006 105 C1029 117 1047 137 1054 161" fill="none"
        stroke="#F4F0DD" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="1028" cy="119" r="5" fill="#F4F0DD" opacity=".58"/>
  <circle cx="1057" cy="160" r="5" fill="#F4F0DD" opacity=".58"/>
  <circle cx="1037" cy="225" r="5" fill="#F4F0DD" opacity=".58"/>

  <text x="70" y="78" fill="#F4F0DD" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700" letter-spacing="3">FEATURED PROJECT / 01</text>

  <text x="70" y="146" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
        font-size="48" font-weight="700">CarERP</text>
  <text x="70" y="184" fill="#F4F0DD" font-family="Arial, Helvetica, sans-serif"
        font-size="21">Used-car dealership ERP · business workflow + data integrity</text>

  <!-- Stack chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">
    <rect x="70" y="220" width="112" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
    <text x="126" y="242" fill="#F4F0DD" text-anchor="middle">Java 21</text>

    <rect x="194" y="220" width="142" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
    <text x="265" y="242" fill="#F4F0DD" text-anchor="middle">Spring Boot</text>

    <rect x="348" y="220" width="138" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
    <text x="417" y="242" fill="#F4F0DD" text-anchor="middle">SQL Server</text>

    <rect x="498" y="220" width="94" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
    <text x="545" y="242" fill="#F4F0DD" text-anchor="middle">JWT</text>

    <rect x="604" y="220" width="102" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
    <text x="655" y="242" fill="#F4F0DD" text-anchor="middle">RBAC</text>
  </g>

  <line x1="70" y1="287" x2="897" y2="287" stroke="#F4F0DD" stroke-opacity=".20"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="324" fill="#779999" font-size="14" font-weight="700" letter-spacing="1.4">ENGINEERING FOCUS</text>

    <text x="70" y="358" fill="#FFFFFF" font-size="17" font-weight="600">Business Workflow</text>
    <text x="260" y="358" fill="#FFFFFF" font-size="17" font-weight="600">Data Consistency</text>
    <text x="445" y="358" fill="#FFFFFF" font-size="17" font-weight="600">Authorization</text>
    <text x="590" y="358" fill="#FFFFFF" font-size="17" font-weight="600">Observable Behavior</text>
  </g>

  <!-- Tiny flow motif -->
  <g transform="translate(922,262)" fill="none" stroke="#F4F0DD" stroke-opacity=".55" stroke-width="2">
    <rect x="0" y="0" width="54" height="40" rx="10"/>
    <rect x="98" y="0" width="54" height="40" rx="10"/>
    <rect x="49" y="74" width="54" height="40" rx="10"/>
    <path d="M54 20 H98"/>
    <path d="M76 40 V74"/>
  </g>
</svg>
